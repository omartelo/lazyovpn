name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      # gotestsum wraps `go test -json`: per-test lines + a DONE count in the
      # job log, and the raw JSON stream for the summary step to count.
      - name: test + coverage
        run: |
          go run gotest.tools/gotestsum@v1.13.0 --format testname --jsonfile test.json -- \
            -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: test summary
        if: ${{ !cancelled() }} # counts matter most when tests fail
        run: |
          [ -f test.json ] || exit 0 # earlier step (gofmt/vet) failed before tests ran
          count() { jq -rs --arg a "$1" '[.[] | select(.Test and .Action==$a)] | length' test.json; }
          passed=$(count pass); failed=$(count fail); skipped=$(count skip)
          pct="n/a"
          [ -f coverage.out ] && pct=$(go tool cover -func=coverage.out | awk '/^total:/ {print $NF}')
          {
            echo "### Tests"
            echo
            echo "| Passed | Failed | Skipped | Coverage |"
            echo "| --- | --- | --- | --- |"
            echo "| $passed | $failed | $skipped | \`$pct\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # Cross-compile both release arches and package the tar.gz via the real
  # .goreleaser.yaml — in snapshot mode (no publish). vet/test only build the
  # host (linux/amd64), so without this an arm64-only break or a goreleaser
  # config drift wouldn't surface until the release tag is pushed. The smoke
  # step proves the packaged binary actually runs.
  build:
    # Gate the (slower) cross-compile + packaging behind the fast gates: only
    # build the release artifacts once test and mutation are green.
    needs: [test, mutation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # goreleaser changelog needs full history

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          # --skip=before drops goreleaser's go-test hook; the test job covers it.
          args: release --snapshot --clean --skip=before

      - name: smoke the linux amd64 artifact
        run: |
          tar -xzf dist/lazyovpn_*_linux_amd64.tar.gz -C /tmp lazyovpn
          /tmp/lazyovpn --version

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: install gremlins
        run: |
          go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Settings (timeout, workers, efficacy gate) come from .gremlins.yaml.
      # Gremlins exits non-zero if efficacy is below the threshold.
      - name: mutation testing
        run: |
          set +e
          gremlins unleash | tee gremlins.log
          code=${PIPESTATUS[0]}
          eff=$(grep -oE 'Test efficacy: [0-9.]+' gremlins.log | grep -oE '[0-9.]+$')
          mcov=$(grep -oE 'Mutator coverage: [0-9.]+' gremlins.log | grep -oE '[0-9.]+$')
          killed=$(grep -oE 'Killed: [0-9]+' gremlins.log | grep -oE '[0-9]+$')
          lived=$(grep -oE 'Lived: [0-9]+' gremlins.log | grep -oE '[0-9]+$')
          notcov=$(grep -oE 'Not covered: [0-9]+' gremlins.log | grep -oE '[0-9]+$')
          # gate lives in .gremlins.yaml (threshold.efficacy); keep in sync.
          gate=$(awk -v e="$eff" 'BEGIN { print (e >= 90) ? "✅" : "❌" }')
          {
            echo "### Mutation testing"
            echo
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Killed | $killed |"
            echo "| Lived | $lived |"
            echo "| Not covered | $notcov |"
            echo "| Test efficacy | \`${eff}%\` $gate (gate ≥ 90%) |"
            echo "| Mutator coverage | \`${mcov}%\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
