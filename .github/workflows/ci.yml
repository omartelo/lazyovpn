name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test + coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: coverage summary
        run: |
          total=$(go tool cover -func=coverage.out | tail -1)
          echo "$total"
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$total" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # Cross-compile both release arches and package the tar.gz via the real
  # .goreleaser.yaml — in snapshot mode (no publish). vet/test only build the
  # host (linux/amd64), so without this an arm64-only break or a goreleaser
  # config drift wouldn't surface until the release tag is pushed. The smoke
  # step proves the packaged binary actually runs.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser changelog needs full history

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          # --skip=before drops goreleaser's go-test hook; the test job covers it.
          args: release --snapshot --clean --skip=before

      - name: smoke the linux amd64 artifact
        run: |
          tar -xzf dist/lazyovpn_*_linux_amd64.tar.gz -C /tmp lazyovpn
          /tmp/lazyovpn --version

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: install gremlins
        run: |
          go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Settings (timeout, workers, efficacy gate) come from .gremlins.yaml.
      # Gremlins exits non-zero if efficacy is below the threshold.
      - name: mutation testing
        run: |
          set +e
          gremlins unleash | tee gremlins.log
          code=${PIPESTATUS[0]}
          {
            echo "### Mutation testing"
            echo '```'
            grep -E "Killed:|Lived:|Test efficacy:|Mutator coverage:" gremlins.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
